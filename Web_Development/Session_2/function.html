<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        //8. Constructor Function Variation 2
        function Student(name, email, course) {
            this.name = name;
            this.email = email;
            this.course = course;
        }

        var s1 = new Student("abc", "abc@gmail.com", "MCAFY");
        var s2 = new Student("xyz", "xyz@gmail.com", "MCASY");

        console.log("Name: ", s1.name, "Email: ", s1.email, "Course: ", s1.course);
        console.log("Name: ", s2.name, "Email: ", s2.email, "Course: ", s2.course);
    </script>
</head>
<body>
</body>
</html>
